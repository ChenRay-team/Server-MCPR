name: Build AutoSync

on:
  push:
    branches: [ main ]
    paths:
      - 'AutoSync/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        working-directory: AutoSync
        run: mvn -B -ntp package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-plugin
          path: AutoSync/target/*.jar
