# ============================================================
#  AutoSync 配置
#  功能：把服务器配置目录双向同步到 GitHub 仓库
#  适用：翼龙面板（不能执行 Linux 指令 / git）环境
#
#  使用方法：
#   1. 在 GitHub 生成 Personal Access Token（勾选 repo 权限）
#      网址: https://github.com/settings/tokens
#   2. 把 token 填到下面的 github.token
#   3. 重启服务器 或 /autosync reload
#   4. 手动同步一次: /autosync now
# ============================================================

github:
  # GitHub 用户名或组织名
  owner: "ChenRay-team"
  # 仓库名
  repo: "Server-MCPR"
  # Personal Access Token（重要：不要分享给别人！）
  token: ""
  # 同步到哪个分支
  branch: "main"

sync:
  # 仓库里存放配置的目录
  remote-folder: "ISeeYou"
  # 服务器上的本地目录（相对服务器根目录，一般是 /plugins 的上一级）
  local-folder: "ISeeYou"
  # 每多少分钟自动同步一次
  interval-minutes: 5
  # 服务器启动时是否立即同步一次
  sync-on-enable: true
  # 服务器关闭时是否同步一次
  sync-on-disable: true
  # 需要排除的文件/目录（相对 local-folder），支持通配目录
  # 例：replay 录像文件不要上传
  exclude:
    - "replay"
    - "instant"
    - "suspicious"

# 调试日志（出错时打开，平时保持 false）
debug: false
