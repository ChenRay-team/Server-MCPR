# ============================================================
#  AutoSync 配置
#  功能：把服务器 replay/player/ 下的 .mcpr 录像自动上传到 GitHub
#  适用：翼龙面板（不能执行 Linux 指令 / git）环境
#
#  同步的本地目录：/home/container/replay/player/玩家名/xxx.mcpr
#  上传到仓库的路径：replay/player/玩家名/xxx.mcpr
#
#  使用方法：
#   1. 在 GitHub 生成 Personal Access Token（勾选 repo 权限）
#      网址: https://github.com/settings/tokens
#   2. 把 token 填到下面的 github.token
#   3. 重启服务器 或 /autosync reload
#   4. 手动同步一次: /autosync now
# ============================================================

github:
  # GitHub 用户名或组织名
  owner: "ChenRay-team"
  # 仓库名
  repo: "Server-MCPR"
  # Personal Access Token（重要：不要分享给别人！）
  token: ""
  # 录像上传到哪个分支
  branch: "main"

sync:
  # 每多少分钟自动同步一次
  interval-minutes: 5
  # 服务器启动时是否立即同步一次
  sync-on-enable: true
  # 服务器关闭时是否同步一次
  sync-on-disable: true
  # 单个录像最大上传大小（MB），超过则跳过
  # GitHub Contents API 上限 100MB，不建议改大
  max-file-size-mb: 100

# 调试日志（出错时打开，平时保持 false）
debug: false
