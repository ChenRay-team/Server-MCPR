name: AutoSync
version: '1.0.0'
main: cn.chenray.autosync.AutoSyncPlugin
api-version: '1.21'
authors: [ChenRay]
description: 服务器配置自动同步到 GitHub 仓库（翼龙面板适用，无需 shell/git）
website: https://github.com/ChenRay-team/Server-MCPR

commands:
  autosync:
    description: AutoSync 管理命令
    usage: /autosync <now|reload>
    permission: autosync.admin

permissions:
  autosync.admin:
    description: 允许使用 /autosync 命令
    default: op
